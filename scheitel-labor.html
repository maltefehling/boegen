<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scheitel-Labor</title>
<!-- V.7 Scheitelform (25.10.2026): Normalparabel y = (x − d)² + e (26.10.2026: Öffnung nach unten ausgeblendet – kein Minus vor der Klammer in der RS). Regler d (blau, x-Richtung) und e (grün, y-Richtung), Öffnung oben/unten.
     Reiter „Ausprobieren“ und „Triff die Parabel“ (Ziel-Parabel gestrichelt, Gleichung einstellen). Nur Normalparabeln (Maltes Vorgabe). -->
<style>
  :root{--ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5;--gitter:#e1e7ee;--par:#b5432f;--d:#2e5d9f;--e:#3f8f3a;--ok:#3f8f3a;--okH:#d6efd0}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button,input{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff} header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1150px;margin:0 auto}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{flex:1 1 200px;min-height:52px;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;font-size:19px;font-weight:700}
  .tabs button[aria-pressed="true"]{background:var(--acc);color:#fff}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 460px;width:100%;max-width:600px;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 300px;min-width:0}
  .gl{font-size:32px;font-weight:800;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;text-align:center;white-space:nowrap}
  .gl .d{color:var(--d)} .gl .e{color:var(--e)}
  .lbl{font-size:16px;color:var(--muted);margin:2px 0 4px}
  .ctl{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .ctl button{width:54px;height:54px;border-radius:12px;border:2px solid var(--acc);background:#fff;color:var(--acc);font-size:26px;font-weight:700;flex:none}
  .ctl input{flex:1;min-width:0;height:44px}
  #rd{accent-color:var(--d)} #re{accent-color:var(--e)}
  .auf{display:flex;gap:8px;margin-bottom:14px} .auf button{flex:1;min-height:50px;border-radius:12px;border:2px solid var(--acc);background:#fff;color:var(--acc);font-size:18px;font-weight:700}
  .auf button[aria-pressed="true"]{background:var(--acc);color:#fff}
  .auf[hidden]{display:none}
  .zahl{font-size:22px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;line-height:1.5}
  .meld{font-size:20px;border-radius:12px;padding:10px 14px;min-height:50px;background:#fff;border:1px solid var(--line);margin-top:10px} .meld.ok{background:var(--okH);border-color:var(--ok)}
  .gross{min-height:54px;width:100%;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;font-size:19px;font-weight:700;margin-top:10px}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px} svg text{font-family:inherit} [hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Scheitel-Labor</h1></header>
<main>
  <div class="tabs" id="tabs"><button data-m="frei" aria-pressed="true">Ausprobieren</button><button data-m="ziel" aria-pressed="false">Triff die Parabel</button></div>
  <div class="wrap">
    <svg id="s" viewBox="0 0 520 520" aria-label="Parabel im Koordinatensystem"></svg>
    <div class="side">
      <div class="gl" id="gl"></div>
      <div class="auf" hidden><button id="oben" aria-pressed="true">nach oben ∪</button><button id="unten" aria-pressed="false">nach unten ∩</button></div>
      <div class="lbl">d verschiebt nach links und rechts</div>
      <div class="ctl"><button id="dm" aria-label="d kleiner">−</button><input id="rd" type="range" min="-5" max="5" step="1" value="0"><button id="dp" aria-label="d größer">+</button></div>
      <div class="lbl">e verschiebt nach oben und unten</div>
      <div class="ctl"><button id="em" aria-label="e kleiner">−</button><input id="re" type="range" min="-5" max="5" step="1" value="0"><button id="ep" aria-label="e größer">+</button></div>
      <div class="zahl" id="zahl"></div>
      <div id="ziel" hidden><div class="meld" id="meld"></div><button class="gross" id="neu">Neue Parabel</button></div>
    </div>
  </div>
</main>
<footer>Fehling · V.7 Scheitelform · Labor</footer>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s");
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;};
const U=40,O=260,X=v=>O+U*v,Y=v=>O-U*v,mi=v=>v<0?"−"+(-v):String(v);
let d=0,e=0,s=1,mode="frei",Z=null;
const rd=document.getElementById("rd"),re=document.getElementById("re");
function kurve(dd,ee,ss,attr){let p="";for(let i=0;i<=300;i++){const x=-6.4+12.8*i/300,y=ss*(x-dd)**2+ee;if(y<-6.6||y>6.6){continue;}p+=(p&&!p.endsWith("|")?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1);}mk("path",{d:p,fill:"none",...attr});}
// Gleichung mit Vorzeichen-Logik: d = −3 → (x + 3)²
function gleichung(dd,ee,ss){const k=dd===0?"x":dd>0?`x − <span class="d">${dd}</span>`:`x + <span class="d">${-dd}</span>`;
  const r=ee===0?"":ee>0?` + <span class="e">${ee}</span>`:` − <span class="e">${-ee}</span>`;return `y = ${ss<0?"−":""}( ${k} )²${r}`;}
function zeichne(){svg.replaceChildren();
  for(let i=-6;i<=6;i++){mk("line",{x1:X(i),x2:X(i),y1:20,y2:500,stroke:"var(--gitter)"});mk("line",{x1:20,x2:500,y1:Y(i),y2:Y(i),stroke:"var(--gitter)"});}
  mk("line",{x1:14,x2:506,y1:O,y2:O,stroke:"#333","stroke-width":2});mk("line",{x1:O,x2:O,y1:506,y2:14,stroke:"#333","stroke-width":2});
  for(let i=-6;i<=6;i+=2){if(!i)continue;let t=mk("text",{x:X(i),y:O+20,"text-anchor":"middle","font-size":15});t.textContent=mi(i);t=mk("text",{x:O-8,y:Y(i)+5,"text-anchor":"end","font-size":15});t.textContent=mi(i);}
  if(mode==="ziel"&&Z)kurve(Z[0],Z[1],Z[2],{stroke:"#9aa7b5","stroke-width":4,"stroke-dasharray":"8 6"});
  kurve(d,e,s,{stroke:"var(--par)","stroke-width":4});
  // Scheitel mit Hilfslinien in den Farben von d und e
  mk("line",{x1:X(d),x2:X(d),y1:Y(0),y2:Y(e),stroke:"var(--d)","stroke-width":2.5,"stroke-dasharray":"6 4"});
  mk("line",{x1:X(0),x2:X(d),y1:Y(e),y2:Y(e),stroke:"var(--e)","stroke-width":2.5,"stroke-dasharray":"6 4"});
  mk("circle",{cx:X(d),cy:Y(e),r:8,fill:"#c0392b",stroke:"#fff","stroke-width":2});
  const t=mk("text",{x:X(d)+12,y:Y(e)+(s>0?24:-12),"font-size":18,"font-weight":700,fill:"#c0392b"});t.textContent=`S ( ${mi(d)} | ${mi(e)} )`;
  document.getElementById("gl").innerHTML=gleichung(d,e,s);
  document.getElementById("zahl").innerHTML=`Scheitel S ( <b style="color:var(--d)">${mi(d)}</b> | <b style="color:var(--e)">${mi(e)}</b> )`;
  if(mode==="ziel"&&Z){const ok=d===Z[0]&&e===Z[1]&&s===Z[2];const m=document.getElementById("meld");m.classList.toggle("ok",ok);
    m.innerHTML=ok?"<b>Getroffen!</b> Lies die Gleichung oben ab – passt sie zum Scheitel?":"Stelle die rote Parabel auf die gestrichelte.";}
}
const setD=v=>{d=Math.max(-5,Math.min(5,v));rd.value=d;zeichne();},setE=v=>{e=Math.max(-5,Math.min(5,v));re.value=e;zeichne();};
rd.oninput=()=>setD(+rd.value);re.oninput=()=>setE(+re.value);
document.getElementById("dm").onclick=()=>setD(d-1);document.getElementById("dp").onclick=()=>setD(d+1);
document.getElementById("em").onclick=()=>setE(e-1);document.getElementById("ep").onclick=()=>setE(e+1);
const setS=v=>{s=v;document.getElementById("oben").setAttribute("aria-pressed",s>0);document.getElementById("unten").setAttribute("aria-pressed",s<0);zeichne();};
document.getElementById("oben").onclick=()=>setS(1);document.getElementById("unten").onclick=()=>setS(-1);
const ZIELE=[[3,-2,1],[-2,1,1],[1,4,1],[-3,-4,1],[2,0,1],[0,-3,1],[4,-5,1]];let zi=-1;
function neu(){zi=(zi+1)%ZIELE.length;Z=ZIELE[zi];d=0;e=0;s=1;rd.value=0;re.value=0;setS(1);}
document.getElementById("neu").onclick=neu;
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  document.getElementById("ziel").hidden=mode!=="ziel";if(mode==="ziel")neu();else zeichne();});
zeichne();
</script>
</body>
</html>
