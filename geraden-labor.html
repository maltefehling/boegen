<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Geraden-Labor</title>
<!-- V.2 Gerade aus Steigung und Punkt: Regler für m und c, Steigungsdreieck (1 nach rechts, m nach oben) und y-Achsenabschnitt live.
     Reiter „Triff die Gerade“: eine Zielgerade (gestrichelt) mit den Reglern treffen. Die Regel steht NICHT auf der Seite – die schreiben die SuS selbst auf. -->
<style>
  :root{--ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5;--gitter:#e1e7ee;--ger:#2f5f8f;--dr:#c0700f;--drH:#fde7c8;--gr:#2e8b3d;--ok:#3f8f3a;--okH:#d6efd0}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button,input{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1150px;margin:0 auto}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{flex:1 1 200px;min-height:52px;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;font-size:19px;font-weight:700}
  .tabs button[aria-pressed="true"]{background:var(--acc);color:#fff}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 460px;width:100%;max-width:600px;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 300px;min-width:0}
  .gl{font-size:34px;font-weight:700;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow-x:auto}
  .gl .m{color:var(--dr)} .gl .c{color:var(--gr)}
  .lbl{font-size:16px;color:var(--muted);margin:2px 0 4px}
  .lbl b{font-size:22px}
  .ctl{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .ctl button{width:54px;height:54px;border-radius:12px;border:2px solid var(--acc);background:#fff;color:var(--acc);font-size:26px;font-weight:700;flex:none}
  .ctl input{flex:1;min-width:0;height:44px;accent-color:var(--acc)}
  .meld{font-size:20px;border-radius:12px;padding:10px 14px;min-height:50px;background:#fff;border:1px solid var(--line)}
  .meld.ok{background:var(--okH);border-color:var(--ok)}
  .gross{min-height:54px;width:100%;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;font-size:19px;font-weight:700;margin-top:10px}
  .hint{font-size:15px;color:var(--muted);margin-top:8px}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Geraden-Labor:  y = m · x + c</h1></header>
<main>
  <div class="tabs" id="tabs">
    <button data-m="frei" aria-pressed="true">Ausprobieren</button>
    <button data-m="ziel" aria-pressed="false">Triff die Gerade</button>
  </div>
  <div class="wrap">
    <svg id="s" viewBox="0 0 520 520" aria-label="Koordinatensystem mit Gerade"></svg>
    <div class="side">
      <div class="gl" id="gl"></div>
      <div class="lbl">Steigung <b class="m" style="color:var(--dr)">m</b></div>
      <div class="ctl"><button id="mm" aria-label="m kleiner">−</button><input id="rm" type="range" min="-3" max="3" step="0.25" value="1"><button id="mp" aria-label="m größer">+</button></div>
      <div class="lbl">y-Achsenabschnitt <b style="color:var(--gr)">c</b></div>
      <div class="ctl"><button id="cm" aria-label="c kleiner">−</button><input id="rc" type="range" min="-5" max="5" step="0.5" value="1"><button id="cp" aria-label="c größer">+</button></div>
      <div id="frei"><div class="hint">Orange: das Steigungsdreieck – 1 nach rechts, dann m nach oben (oder unten). Grün: hier schneidet die Gerade die y-Achse.</div>
        <button class="gross" id="reset">Zurück auf m = 1, c = 1</button></div>
      <div id="ziel" hidden><div class="meld" id="meld"></div><button class="gross" id="neu">Neue Gerade</button>
        <div class="hint">Stelle m und c so ein, dass deine Gerade auf der gestrichelten liegt.</div></div>
    </div>
  </div>
</main>
<footer>Fehling · Gerade aus Steigung und Punkt</footer>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s");
const mk=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
const fmt=v=>{const r=Math.round(v*100)/100;return Math.abs(r).toString().replace(".",",");};
const U=40,O=260,X=v=>O+U*v,Y=v=>O-U*v;          // 1 Einheit = 40 px, Ursprung in der Mitte, sichtbar −6 … 6
let m=1,c=1,mode="frei",zm=0,zc=0;
const rm=document.getElementById("rm"),rc=document.getElementById("rc");
function gleichung(mm,cc){
  const mt=mm===0?"":`<span class="m">${mm<0?"−":""}${Math.abs(mm)===1?"":fmt(mm)+" · "}</span>x`;
  const ct=cc===0?(mm===0?`<span class="c">0</span>`:""):`${mm===0?"":(cc<0?" − ":" + ")}<span class="c">${mm===0&&cc<0?"−":""}${fmt(cc)}</span>`;
  return "y = "+mt+ct;
}
function zeichne(){
  svg.replaceChildren();
  for(let i=-6;i<=6;i++){mk("line",{x1:X(i),x2:X(i),y1:20,y2:500,stroke:"var(--gitter)"});mk("line",{x1:20,x2:500,y1:Y(i),y2:Y(i),stroke:"var(--gitter)"});}
  mk("line",{x1:14,x2:506,y1:O,y2:O,stroke:"#333","stroke-width":2});mk("line",{x1:O,x2:O,y1:506,y2:14,stroke:"#333","stroke-width":2});
  for(let i=-6;i<=6;i+=2){if(!i)continue;let t=mk("text",{x:X(i),y:O+20,"text-anchor":"middle","font-size":15});t.textContent=i<0?"−"+(-i):i;
    t=mk("text",{x:O-8,y:Y(i)+5,"text-anchor":"end","font-size":15});t.textContent=i<0?"−"+(-i):i;}
  let t=mk("text",{x:500,y:O-8,"text-anchor":"end","font-size":17,fill:"var(--acc)"});t.textContent="x";
  t=mk("text",{x:O+8,y:26,"font-size":17,fill:"var(--acc)"});t.textContent="y";
  const clip=mk("clipPath",{id:"k"});mk("rect",{x:20,y:20,width:480,height:480},clip);
  const g=mk("g",{"clip-path":"url(#k)"});
  if(mode==="ziel")mk("line",{x1:X(-7),y1:Y(zm*-7+zc),x2:X(7),y2:Y(zm*7+zc),stroke:"#8a9bb0","stroke-width":5,"stroke-dasharray":"12 9"},g);
  mk("line",{x1:X(-7),y1:Y(m*-7+c),x2:X(7),y2:Y(m*7+c),stroke:"var(--ger)","stroke-width":4},g);
  // Steigungsdreieck ab dem y-Achsenabschnitt: 1 nach rechts, m nach oben
  mk("line",{x1:X(0),y1:Y(c),x2:X(1),y2:Y(c),stroke:"var(--dr)","stroke-width":4},g);
  mk("line",{x1:X(1),y1:Y(c),x2:X(1),y2:Y(c+m),stroke:"var(--dr)","stroke-width":5},g);
  t=mk("text",{x:X(0.5),y:Y(c)+(m>=0?20:-8),"text-anchor":"middle","font-size":16,"font-weight":700,fill:"var(--dr)"},g);t.textContent="1";
  if(m!==0){t=mk("text",{x:X(1)+8,y:Y(c+m/2)+6,"font-size":17,"font-weight":700,fill:"var(--dr)"},g);t.textContent=(m<0?"−":"")+fmt(m);}
  mk("circle",{cx:X(0),cy:Y(c),r:8,fill:"var(--gr)",stroke:"#fff","stroke-width":2},g);
  document.getElementById("gl").innerHTML=gleichung(m,c);
  if(mode==="ziel"){const ok=m===zm&&c===zc,e=document.getElementById("meld");e.classList.toggle("ok",ok);
    e.innerHTML=ok?`<b>Getroffen!</b> Die Gerade heißt ${gleichung(zm,zc).replace(/<[^>]+>/g,"")}.`:"Noch nicht – passt zuerst die Steigung oder zuerst c?";}
}
const setM=v=>{m=Math.max(-3,Math.min(3,Math.round(v*4)/4));rm.value=m;zeichne();};
const setC=v=>{c=Math.max(-5,Math.min(5,Math.round(v*2)/2));rc.value=c;zeichne();};
rm.oninput=()=>setM(+rm.value);rc.oninput=()=>setC(+rc.value);
document.getElementById("mm").onclick=()=>setM(m-0.25);document.getElementById("mp").onclick=()=>setM(m+0.25);
document.getElementById("cm").onclick=()=>setC(c-0.5);document.getElementById("cp").onclick=()=>setC(c+0.5);
document.getElementById("reset").onclick=()=>{m=1;c=1;rm.value=1;rc.value=1;zeichne();};
// Zielgeraden: ganze oder halbe Steigungen, ganze c – nie m = 1, c = 1 (Startwert)
const ZIELE=[[2,-1],[-1,3],[0.5,2],[-0.5,-2],[3,0],[0,-3],[-2,4],[1.5,-4],[0.25,1],[-3,-1]];
let zi=-1;
function neu(){zi=(zi+1+Math.floor(Math.random()*(ZIELE.length-1)))%ZIELE.length;[zm,zc]=ZIELE[zi];m=1;c=1;rm.value=1;rc.value=1;zeichne();}
document.getElementById("neu").onclick=neu;
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  document.getElementById("frei").hidden=mode!=="frei";document.getElementById("ziel").hidden=mode!=="ziel";
  if(mode==="ziel")neu();else zeichne();});
zeichne();
</script>
</body>
</html>
