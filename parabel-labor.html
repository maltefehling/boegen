<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Parabel-Labor</title>
<!-- V.5 Parabeln y = ax² + c. Regler a (−3 … 3) und c (−5 … 8). Live: Scheitel S (0 | c), y-Achse als Spiegelachse (lila),
     1-4-9-Treppe vom Scheitel (1 · a, 4 · a, 9 · a). Bewusst KEIN Regler zum seitlichen Verschieben – der Scheitel bleibt auf der y-Achse (Maltes roter Faden).
     Reiter „Triff den Bogen“: eine Zielparabel nachstellen. -->
<style>
  :root{--ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5;--gitter:#e1e7ee;--par:#b5432f;--or:#c0700f;--li:#7B4FA0;--rot:#c0392b;--ok:#3f8f3a;--okH:#d6efd0;--gelb:#fff3c4;--gelbL:#e0b400}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button,input{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1150px;margin:0 auto}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{flex:1 1 200px;min-height:52px;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;font-size:19px;font-weight:700}
  .tabs button[aria-pressed="true"]{background:var(--acc);color:#fff}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 440px;width:100%;max-width:540px;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 300px;min-width:0}
  .gl{font-size:32px;font-weight:700;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;white-space:nowrap;overflow-x:auto}
  .gl .a{color:var(--or)} .gl .c{color:var(--rot)}
  .lbl{font-size:16px;color:var(--muted);margin:2px 0 4px}
  .ctl{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .ctl button{width:54px;height:54px;border-radius:12px;border:2px solid var(--acc);background:#fff;color:var(--acc);font-size:26px;font-weight:700;flex:none}
  .ctl input{flex:1;min-width:0;height:44px;accent-color:var(--acc)}
  .zahl{font-size:20px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;line-height:1.5;font-variant-numeric:tabular-nums}
  .zahl b{color:var(--or)} .s{color:var(--rot);font-weight:700} .sp{color:var(--li);font-weight:700}
  .warn{font-size:19px;background:var(--gelb);border:1px solid var(--gelbL);border-radius:12px;padding:10px 14px;margin-bottom:10px}
  .meld{font-size:20px;border-radius:12px;padding:10px 14px;min-height:50px;background:#fff;border:1px solid var(--line)}
  .meld.ok{background:var(--okH);border-color:var(--ok)}
  .gross{min-height:54px;width:100%;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;font-size:19px;font-weight:700;margin-top:10px}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Parabel-Labor:  y = a · x² + c</h1></header>
<main>
  <div class="tabs" id="tabs">
    <button data-m="frei" aria-pressed="true">Ausprobieren</button>
    <button data-m="ziel" aria-pressed="false">Triff den Bogen</button>
  </div>
  <div class="wrap">
    <svg id="s" viewBox="0 0 520 640" aria-label="Parabel im Koordinatensystem"></svg>
    <div class="side">
      <div class="gl" id="gl"></div>
      <div class="lbl">a (Form und Öffnung)</div>
      <div class="ctl"><button id="am" aria-label="a kleiner">−</button><input id="ra" type="range" min="-3" max="3" step="0.25" value="1"><button id="ap" aria-label="a größer">+</button></div>
      <div class="lbl">c (Höhe des Scheitels)</div>
      <div class="ctl"><button id="cm" aria-label="c kleiner">−</button><input id="rc" type="range" min="-5" max="8" step="0.5" value="0"><button id="cp" aria-label="c größer">+</button></div>
      <div class="warn" id="warn" hidden></div>
      <div class="zahl" id="zahl"></div>
      <div id="ziel" hidden><div class="meld" id="meld"></div><button class="gross" id="neu">Neuer Bogen</button></div>
    </div>
  </div>
</main>
<footer>Fehling · Parabeln y = ax² + c</footer>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s");
const mk=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
const fmt=v=>{const r=Math.round(v*100)/100;return (r<0?"−":"")+Math.abs(r).toString().replace(".",",");};
const U=36,OX=260,TOP=24,YMAX=10,YMIN=-6,X=v=>OX+U*v,Y=v=>TOP+U*(YMAX-v);
let a=1,c=0,mode="frei",za=0,zc=0;
const ra=document.getElementById("ra"),rc=document.getElementById("rc");
function gleichung(aa,cc){
  if(aa===0)return `y = <span class="c">${fmt(cc)}</span>`;
  const at=aa===1?"":aa===-1?"−":fmt(aa)+" · ";
  const ct=cc===0?"":(cc<0?" − ":" + ")+`<span class="c">${fmt(Math.abs(cc))}</span>`;
  return `y = <span class="a">${at}</span>x²${ct}`;
}
function para(aa,cc,attr,g){let d="";for(let i=0;i<=240;i++){const x=-6.5+13*i/240,y=aa*x*x+cc;d+=(i?"L":"M")+X(x).toFixed(1)+" "+Y(Math.max(-30,Math.min(40,y))).toFixed(1);}mk("path",{d,fill:"none",...attr},g);}
function zeichne(){
  svg.replaceChildren();
  for(let i=-6;i<=6;i++)mk("line",{x1:X(i),x2:X(i),y1:Y(YMAX),y2:Y(YMIN),stroke:"var(--gitter)"});
  for(let j=YMIN;j<=YMAX;j++)mk("line",{x1:X(-6),x2:X(6),y1:Y(j),y2:Y(j),stroke:"var(--gitter)"});
  mk("line",{x1:X(-6.3),x2:X(6.4),y1:Y(0),y2:Y(0),stroke:"#333","stroke-width":2});
  for(let i=-6;i<=6;i+=2){if(!i)continue;const t=mk("text",{x:X(i),y:Y(0)+20,"text-anchor":"middle","font-size":15});t.textContent=i<0?"−"+(-i):i;}
  for(let j=YMIN;j<=YMAX;j+=2){if(!j)continue;const t=mk("text",{x:X(0)-8,y:Y(j)+5,"text-anchor":"end","font-size":15});t.textContent=j<0?"−"+(-j):j;}
  // y-Achse als Spiegelachse hervorheben
  mk("line",{x1:X(0),x2:X(0),y1:Y(YMIN)+4,y2:Y(YMAX)-14,stroke:"var(--li)","stroke-width":5,opacity:.35});
  mk("line",{x1:X(0),x2:X(0),y1:Y(YMIN)+4,y2:Y(YMAX)-14,stroke:"#333","stroke-width":2});
  let t=mk("text",{x:X(6.4),y:Y(0)-8,"text-anchor":"end","font-size":16,fill:"var(--acc)"});t.textContent="x";
  t=mk("text",{x:X(0)+8,y:Y(YMAX)-2,"font-size":16,fill:"var(--acc)"});t.textContent="y";
  const clip=mk("clipPath",{id:"k"});mk("rect",{x:X(-6),y:Y(YMAX),width:12*U,height:(YMAX-YMIN)*U},clip);const g=mk("g",{"clip-path":"url(#k)"});
  if(mode==="ziel")para(za,zc,{stroke:"#8a9bb0","stroke-width":6,"stroke-dasharray":"12 9"},g);
  para(a,c,{stroke:"var(--par)","stroke-width":4},g);
  // 1-4-9-Treppe rechts vom Scheitel
  if(a!==0){mk("line",{x1:X(0),x2:X(3.3),y1:Y(c),y2:Y(c),stroke:"var(--or)","stroke-width":1.5,"stroke-dasharray":"5 4"},g);
    [1,2,3].forEach(k=>{const d=a*k*k;mk("line",{x1:X(k),x2:X(k),y1:Y(c),y2:Y(c+d),stroke:"var(--or)","stroke-width":4},g);
      const tt=mk("text",{x:X(k)+5,y:Y(c+d/2)+5,"font-size":15,"font-weight":700,fill:"var(--or)"},g);tt.textContent=fmt(d);});}
  mk("circle",{cx:X(0),cy:Y(c),r:8,fill:"var(--rot)",stroke:"#fff","stroke-width":2},g);
  t=mk("text",{x:X(0)-12,y:Y(c)+(a<0?-12:22),"text-anchor":"end","font-size":16,"font-weight":700,fill:"var(--rot)"},g);t.textContent=`S ( 0 | ${fmt(c)} )`;
  document.getElementById("gl").innerHTML=gleichung(a,c);
  const w=document.getElementById("warn");w.hidden=a!==0;if(a===0)w.innerHTML="<b>a = 0:</b> Das x² fällt weg – keine Parabel mehr, sondern eine waagrechte Gerade.";
  document.getElementById("zahl").innerHTML=a===0?`<span class="s">c = ${fmt(c)}</span>`:
    `Scheitel <span class="s">S ( 0 | ${fmt(c)} )</span> – auf der <span class="sp">y-Achse</span><br>Vom Scheitel 1 · 2 · 3 nach rechts → <b>${fmt(a)} | ${fmt(4*a)} | ${fmt(9*a)}</b> ${a>0?"nach oben":"nach unten"}<br>${a>0?"nach oben geöffnet":"nach unten geöffnet (ein Bogen)"}`;
  if(mode==="ziel"){const ok=a===za&&c===zc,e=document.getElementById("meld");e.classList.toggle("ok",ok);
    e.innerHTML=ok?`<b>Getroffen!</b> ${gleichung(za,zc).replace(/<[^>]+>/g,"")}`:"Noch nicht. Tipp: Wo liegt der Scheitel? Wie weit geht es 1 nach rechts hinunter oder hinauf?";}
}
const setA=v=>{a=Math.max(-3,Math.min(3,Math.round(v*4)/4));ra.value=a;zeichne();};
const setC=v=>{c=Math.max(-5,Math.min(8,Math.round(v*2)/2));rc.value=c;zeichne();};
ra.oninput=()=>setA(+ra.value);rc.oninput=()=>setC(+rc.value);
document.getElementById("am").onclick=()=>setA(a-0.25);document.getElementById("ap").onclick=()=>setA(a+0.25);
document.getElementById("cm").onclick=()=>setC(c-0.5);document.getElementById("cp").onclick=()=>setC(c+0.5);
const ZIELE=[[-0.5,8],[2,-3],[-2,6],[0.5,1],[-1,4],[1,-5],[-0.25,7],[3,-2],[-1.5,5],[0.25,-4]];let zi=-1;
function neu(){zi=(zi+1)%ZIELE.length;[za,zc]=ZIELE[zi];a=1;c=0;ra.value=1;rc.value=0;zeichne();}
document.getElementById("neu").onclick=neu;
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  document.getElementById("ziel").hidden=mode!=="ziel";if(mode==="ziel")neu();else zeichne();});
zeichne();
</script>
</body>
</html>
