<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Senkrecht-Labor</title>
<!-- V.4 Senkrechte Geraden. Reiter „Drehen“: m₁ einstellen, die Senkrechte dreht mit (rechter Winkel markiert), m₁ und m₂ werden angezeigt –
     das Produkt NICHT (rechnen die SuS selbst, Entdeckung m₁ · m₂ = −1). Reiter „Treffer?“: m₂ selbst einstellen, Winkel live, Rückmeldung bei 90°. -->
<style>
  :root{--ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5;--gitter:#e1e7ee;--g1:#55687a;--g2:#1f4e79;--dr:#c0700f;--li:#7B4FA0;--ok:#3f8f3a;--okH:#d6efd0}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button,input{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff}
  header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1150px;margin:0 auto}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{flex:1 1 200px;min-height:52px;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;font-size:19px;font-weight:700}
  .tabs button[aria-pressed="true"]{background:var(--acc);color:#fff}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 460px;width:100%;max-width:600px;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 300px;min-width:0}
  .lbl{font-size:16px;color:var(--muted);margin:2px 0 4px}
  .ctl{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
  .ctl button{width:54px;height:54px;border-radius:12px;border:2px solid var(--acc);background:#fff;color:var(--acc);font-size:26px;font-weight:700;flex:none}
  .ctl input{flex:1;min-width:0;height:44px;accent-color:var(--acc)}
  .zahl{font-size:24px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;font-variant-numeric:tabular-nums;line-height:1.5}
  .zahl .a{color:var(--g1);font-weight:700}.zahl .b{color:var(--g2);font-weight:700}
  .meld{font-size:20px;border-radius:12px;padding:10px 14px;min-height:50px;background:#fff;border:1px solid var(--line)}
  .meld.ok{background:var(--okH);border-color:var(--ok)}
  .gross{min-height:54px;width:100%;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;font-size:19px;font-weight:700;margin-top:10px}
  .hint{font-size:15px;color:var(--muted);margin-top:8px}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
  [hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>Senkrecht-Labor</h1></header>
<main>
  <div class="tabs" id="tabs">
    <button data-m="drehen" aria-pressed="true">Drehen</button>
    <button data-m="treffer" aria-pressed="false">Treffer?</button>
  </div>
  <div class="wrap">
    <svg id="s" viewBox="0 0 520 520" aria-label="Zwei Geraden"></svg>
    <div class="side">
      <div class="lbl">Steigung m₁ der grauen Geraden</div>
      <div class="ctl"><button id="m1m" aria-label="kleiner">−</button><input id="r1" type="range" min="0" max="11" step="1" value="9"><button id="m1p" aria-label="größer">+</button></div>
      <div id="t2" hidden><div class="lbl">Steigung m₂ der blauen Geraden – stelle sie so ein, dass sie senkrecht steht</div>
        <div class="ctl"><button id="m2m" aria-label="kleiner">−</button><input id="r2" type="range" min="-4" max="4" step="0.25" value="1"><button id="m2p" aria-label="größer">+</button></div></div>
      <div class="zahl" id="zahl"></div>
      <div class="meld" id="meld" hidden></div>
      <button class="gross" id="neu" hidden>Neue Aufgabe</button>
      <div class="hint" id="hint">Grau: die Gerade mit m₁. Blau: die Senkrechte dazu. Orange und lila: die Steigungsdreiecke (1 nach rechts).</div>
    </div>
  </div>
</main>
<footer>Fehling · Senkrechte Geraden</footer>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s");
const mk=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
const fmt=v=>{const r=Math.round(v*100)/100;return (r<0?"−":"")+Math.abs(r).toString().replace(".",",");};
const M1=[-4,-3,-2,-1,-0.5,-0.25,0.25,0.5,1,2,3,4];
const U=40,O=260,X=v=>O+U*v,Y=v=>O-U*v;
let mode="drehen",i1=9,m2=1;
const r1=document.getElementById("r1"),r2=document.getElementById("r2");
// m₂ anzeigen: bei ganzzahligem m₁ ≥ 3 zusätzlich als Bruch
const zeigM2=m1=>{const v=-1/m1;return Number.isInteger(m1)&&Math.abs(m1)>=3?`${v<0?"−":""}1/${Math.abs(m1)} ≈ ${fmt(v)}`:fmt(v);};
function winkel(a,b){let w=Math.abs(Math.atan(a)-Math.atan(b))*180/Math.PI;if(w>90)w=180-w;return Math.round(w);}
function zeichne(){
  svg.replaceChildren();const m1=M1[i1],mb=mode==="drehen"?-1/m1:m2;
  for(let i=-6;i<=6;i++){mk("line",{x1:X(i),x2:X(i),y1:20,y2:500,stroke:"var(--gitter)"});mk("line",{x1:20,x2:500,y1:Y(i),y2:Y(i),stroke:"var(--gitter)"});}
  mk("line",{x1:14,x2:506,y1:O,y2:O,stroke:"#333","stroke-width":2});mk("line",{x1:O,x2:O,y1:506,y2:14,stroke:"#333","stroke-width":2});
  for(let i=-6;i<=6;i+=2){if(!i)continue;let t=mk("text",{x:X(i),y:O+20,"text-anchor":"middle","font-size":15});t.textContent=i<0?"−"+(-i):i;
    t=mk("text",{x:O-8,y:Y(i)+5,"text-anchor":"end","font-size":15});t.textContent=i<0?"−"+(-i):i;}
  const clip=mk("clipPath",{id:"k"});mk("rect",{x:20,y:20,width:480,height:480},clip);const g=mk("g",{"clip-path":"url(#k)"});
  const ger=(m,f,w)=>mk("line",{x1:X(-8),y1:Y(-8*m),x2:X(8),y2:Y(8*m),stroke:f,"stroke-width":w},g);
  ger(m1,"var(--g1)",4);ger(mb,"var(--g2)",4);
  // Steigungsdreiecke ab dem Schnittpunkt (0 | 0): 1 nach rechts, m nach oben
  const dreieck=(m,f)=>{mk("line",{x1:X(0),y1:Y(0),x2:X(1),y2:Y(0),stroke:f,"stroke-width":3,"stroke-dasharray":"6 4"},g);mk("line",{x1:X(1),y1:Y(0),x2:X(1),y2:Y(m),stroke:f,"stroke-width":4},g);};
  dreieck(m1,"var(--dr)");dreieck(mb,"var(--li)");
  const senk=Math.abs(m1*mb+1)<1e-9;
  if(senk){ // rechter Winkel wie im Unterricht: Bogen mit Punkt
    let a1=Math.atan(m1),a2=Math.atan(mb);if(a1>a2)[a1,a2]=[a2,a1];   // beide Richtungen nach rechts, Winkel zwischen ihnen = 90°
    const R=26;let d="";for(let i=0;i<=24;i++){const t=a1+(a2-a1)*i/24;d+=(i?"L":"M")+(O+R*Math.cos(t)).toFixed(1)+" "+(O-R*Math.sin(t)).toFixed(1);}
    mk("path",{d,fill:"none",stroke:"#333","stroke-width":2});
    const tm=(a1+a2)/2;mk("circle",{cx:O+13*Math.cos(tm),cy:O-13*Math.sin(tm),r:3,fill:"#333"});}
  document.getElementById("zahl").innerHTML=`<span class="a">m₁ = ${fmt(m1)}</span><br><span class="b">m₂ = ${mode==="drehen"?zeigM2(m1):fmt(mb)}</span>`+(mode==="treffer"?`<br>Winkel: ${winkel(m1,mb)}°`:"");
  if(mode==="treffer"){const e=document.getElementById("meld");e.classList.toggle("ok",senk);
    e.innerHTML=senk?"<b>Senkrecht!</b> Die beiden Geraden bilden einen rechten Winkel.":"Noch nicht senkrecht.";}
}
const set1=i=>{i1=Math.max(0,Math.min(M1.length-1,i));r1.value=i1;zeichne();};
const set2=v=>{m2=Math.max(-4,Math.min(4,Math.round(v*4)/4));r2.value=m2;zeichne();};
r1.oninput=()=>set1(+r1.value);r2.oninput=()=>set2(+r2.value);
document.getElementById("m1m").onclick=()=>set1(i1-1);document.getElementById("m1p").onclick=()=>set1(i1+1);
document.getElementById("m2m").onclick=()=>set2(m2-0.25);document.getElementById("m2p").onclick=()=>set2(m2+0.25);
// Treffer-Aufgaben: m₁ so gewählt, dass −1/m₁ im 0,25-Raster erreichbar ist
const ZIELE=[2,-4,0.5,-0.25,1,-2,4,-0.5,0.25,-1];let zi=-1;
function neu(){zi=(zi+1)%ZIELE.length;i1=M1.indexOf(ZIELE[zi]);r1.value=i1;m2=1;r2.value=1;zeichne();}
document.getElementById("neu").onclick=neu;
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  const t=mode==="treffer";document.getElementById("t2").hidden=!t;document.getElementById("meld").hidden=!t;document.getElementById("neu").hidden=!t;
  r1.disabled=t;document.getElementById("m1m").disabled=t;document.getElementById("m1p").disabled=t;
  document.getElementById("hint").textContent=t?"m₁ ist vorgegeben. Stelle m₂ ein, bis die blaue Gerade senkrecht auf der grauen steht.":"Grau: die Gerade mit m₁. Blau: die Senkrechte dazu. Orange und lila: die Steigungsdreiecke (1 nach rechts).";
  if(t)neu();else zeichne();});
zeichne();
</script>
</body>
</html>
