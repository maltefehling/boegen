<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Nullstellen-Labor</title>
<!-- V.8 (25.10.2026, Malte): Verständnis „Warum ist y bei einer Nullstelle immer 0?“ Ein Punkt läuft über mehrere Parabeln,
     die Höhe (y-Wert) wird laufend angezeigt; an der x-Achse springt sie auf 0 und eine Markierung ( x | 0 ) bleibt stehen.
     Parabeln: (x+2)²−1 · (x−1)²−4 · (x−2)² (eine Nullstelle) · (x+1)²+2 (keine). Andere als im Skript. -->
<style>
  :root{--acc:#1f4e79;--par:#b5432f;--gr:#3f8f3a;--grH:#d9f0d6;--or:#c0700f;--ink:#1b2a3a;--muted:#5b6b7c;--bg:#f4f7fb;--line:#c9d6e5;--gitter:#e1e7ee}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff} header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1100px;margin:0 auto}
  .kn{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .kn button{flex:1 1 170px;min-height:52px;border-radius:12px;font-size:18px;font-weight:700;border:2px solid var(--acc);background:#fff;color:var(--acc)}
  .kn button.h{background:var(--acc);color:#fff} .kn button:disabled{opacity:.4}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 460px;width:100%;max-width:580px;height:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 300px}
  .gl{font-size:26px;font-weight:800;color:var(--par);padding:8px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;text-align:center}
  .y{font-size:40px;font-weight:800;text-align:center;padding:10px;border-radius:12px;background:#fff;border:2px solid var(--line);transition:background .3s,border-color .3s}
  .y.null{background:var(--grH);border-color:var(--gr);color:var(--gr)}
  .txt{font-size:19px;line-height:1.45;margin:12px 0;min-height:56px}
  .liste{font-size:20px;line-height:1.8;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:50px}
  .liste b{color:var(--gr)}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:12px 0} svg text{font-family:inherit}
</style>
</head>
<body>
<header><h1>Nullstellen-Labor: Warum ist y = 0?</h1></header>
<main>
  <div class="kn"><button class="h" id="play">▶ Abspielen</button><button id="next">Nächste Parabel</button><button id="reset">Von vorn</button></div>
  <div class="wrap"><svg id="s" viewBox="0 0 520 520"></svg>
    <div class="side"><div class="gl" id="gl"></div><div class="y" id="y">y = …</div><div class="txt" id="txt"></div>
      <div style="font-size:15px;color:var(--muted)">Gesammelte Punkte auf der x-Achse:</div><div class="liste" id="liste"></div></div></div>
</main>
<footer>Fehling · V.8 Nullstellen · Labor</footer>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s");
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;};
const U=40,O=260,X=v=>O+U*v,Y=v=>O-U*v,fmt=v=>{const r=Math.round(v*10)/10;return (r<0?"−":"")+String(Math.abs(r)).replace(".",",");};
const P=[{g:"y = ( x + 2 )² − 1",f:x=>(x+2)**2-1,n:[-3,-1]},{g:"y = ( x − 1 )² − 4",f:x=>(x-1)**2-4,n:[-1,3]},
         {g:"y = ( x − 2 )²",f:x=>(x-2)**2,n:[2]},{g:"y = ( x + 1 )² + 2",f:x=>(x+1)**2+2,n:[]}];
let k=0,timer=null,lauf=null,gesammelt=[];
function grund(){svg.replaceChildren();
  for(let i=-6;i<=6;i++){mk("line",{x1:X(i),x2:X(i),y1:20,y2:500,stroke:"var(--gitter)"});mk("line",{x1:20,x2:500,y1:Y(i),y2:Y(i),stroke:"var(--gitter)"});}
  mk("line",{x1:14,x2:506,y1:O,y2:O,stroke:"#333","stroke-width":2.5});mk("line",{x1:O,x2:O,y1:506,y2:14,stroke:"#333","stroke-width":2});
  for(let i=-6;i<=6;i+=2){if(!i)continue;let t=mk("text",{x:X(i),y:O+20,"text-anchor":"middle","font-size":15});t.textContent=fmt(i);t=mk("text",{x:O-8,y:Y(i)+5,"text-anchor":"end","font-size":15});t.textContent=fmt(i);}
  const t=mk("text",{x:500,y:O-8,"text-anchor":"end","font-size":15,fill:"#333"});t.textContent="x-Achse: Höhe 0";}
function parabel(){grund();const p=P[k];let d="";for(let i=0;i<=300;i++){const x=-6.2+12.4*i/300,y=p.f(x);if(y<-6.4||y>6.4)continue;d+=(d?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1);}
  mk("path",{d,fill:"none",stroke:"var(--par)","stroke-width":4});document.getElementById("gl").textContent=p.g;}
function markiere(x){mk("circle",{cx:X(x),cy:Y(0),r:8,fill:"var(--gr)",stroke:"#fff","stroke-width":2});
  const t=mk("text",{x:X(x),y:Y(0)+(gesammelt.length%2?38:-14),"text-anchor":"middle","font-size":17,"font-weight":800,fill:"var(--gr)"});t.textContent=`( ${fmt(x)} | 0 )`;
  gesammelt.push(x);document.getElementById("liste").innerHTML=gesammelt.map(v=>`( ${fmt(v)} | <b>0</b> )`).join(" &nbsp; ");}
function laufe(fertig){parabel();const p=P[k];const pt=mk("circle",{r:9,fill:"var(--or)"}),h=mk("line",{stroke:"var(--or)","stroke-width":3,"stroke-dasharray":"6 4"});
  const yEl=document.getElementById("y"),txt=document.getElementById("txt");let x=-5.5,naechste=0;const ns=[...p.n];
  txt.textContent=ns.length?"Achte auf die Höhe des Punkts, wenn er die x-Achse erreicht.":"Achte auf die Höhe – erreicht der Punkt die x-Achse?";
  clearInterval(lauf);lauf=setInterval(()=>{let xn=x+0.04;
    if(ns.length&&xn>=ns[0]){xn=ns.shift();}            // genau auf der Nullstelle anhalten
    x=xn;let y=p.f(x);if(Math.abs(y)<1e-9)y=0;
    if(y>6.4||y<-6.4){pt.setAttribute("opacity",0);h.setAttribute("opacity",0);}else{pt.setAttribute("opacity",1);h.setAttribute("opacity",1);
      pt.setAttribute("cx",X(x));pt.setAttribute("cy",Y(y));h.setAttribute("x1",X(x));h.setAttribute("x2",X(x));h.setAttribute("y1",Y(0));h.setAttribute("y2",Y(y));}
    yEl.textContent="Höhe:  y = "+fmt(y);yEl.classList.toggle("null",y===0);
    if(y===0&&p.n.includes(x)){markiere(x);txt.innerHTML="<b>Auf der x-Achse ist die Höhe 0 – also y = 0.</b> Das ist eine Nullstelle.";
      clearInterval(lauf);setTimeout(()=>{if(x<5.5)laufWeiter();},1600);return;}
    if(x>=5.5){clearInterval(lauf);if(!p.n.length)txt.innerHTML="Diese Parabel erreicht <b>nie die Höhe 0</b> – sie hat <b>keine Nullstelle</b>.";
      else if(p.n.length===1)txt.innerHTML="Hier berührt die Parabel die x-Achse nur in einem Punkt – <b>eine Nullstelle</b>.";
      fertig&&fertig();}},40);
  function laufWeiter(){lauf=setInterval(()=>{let xn=x+0.04;if(ns.length&&xn>=ns[0])xn=ns.shift();x=xn;let y=p.f(x);if(Math.abs(y)<1e-9)y=0;
    if(y>6.4||y<-6.4){pt.setAttribute("opacity",0);h.setAttribute("opacity",0);}else{pt.setAttribute("opacity",1);h.setAttribute("opacity",1);
      pt.setAttribute("cx",X(x));pt.setAttribute("cy",Y(y));h.setAttribute("x1",X(x));h.setAttribute("x2",X(x));h.setAttribute("y1",Y(0));h.setAttribute("y2",Y(y));}
    yEl.textContent="Höhe:  y = "+fmt(y);yEl.classList.toggle("null",y===0);
    if(y===0&&p.n.includes(x)){markiere(x);clearInterval(lauf);setTimeout(()=>{if(x<5.5)laufWeiter();},1600);return;}
    if(x>=5.5){clearInterval(lauf);if(p.n.length===1)txt.innerHTML="Hier berührt die Parabel die x-Achse nur in einem Punkt – <b>eine Nullstelle</b>.";fertig&&fertig();}},40);}
}
function zeigeEnde(){document.getElementById("txt").innerHTML="Alle Punkte auf der x-Achse haben als zweite Zahl die <b>0</b>: Die x-Achse liegt auf der Höhe 0. <b>Darum setzt man für Nullstellen y = 0.</b>";}
document.getElementById("next").onclick=()=>{clearInterval(timer);clearInterval(lauf);if(k<P.length-1){k++;laufe();}else zeigeEnde();};
document.getElementById("reset").onclick=()=>{clearInterval(timer);clearInterval(lauf);k=0;gesammelt=[];document.getElementById("liste").innerHTML="";parabel();document.getElementById("y").textContent="y = …";document.getElementById("txt").textContent="Tippe auf „Abspielen“.";};
document.getElementById("play").onclick=()=>{document.getElementById("reset").onclick();const kette=()=>laufe(()=>{if(k<P.length-1){setTimeout(()=>{k++;kette();},1800);}else setTimeout(zeigeEnde,1200);});kette();};
document.getElementById("reset").onclick();
</script>
</body>
</html>
