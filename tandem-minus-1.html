<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Erklär-Tandem ★: Woher kommt das Minus?</title>
<!-- Erzeugt von werkzeug/tandem_minus.py (V.3 Gerade durch zwei Punkte, Erklär-Tandem). -->
<style>
  :root{--acc:#1f4e79;--or:#c0700f;--orH:#fde7c8;--bl:#2e5d9f;--blH:#dce8f7;--ink:#1b2a3a;--muted:#5b6b7c;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5;--gitter:#e3e8ef}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff} header h1{font-size:20px;margin:0}
  main{padding:12px 16px 24px;max-width:1000px;margin:0 auto}
  .knoepfe{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .knoepfe button{flex:1 1 170px;min-height:52px;border-radius:12px;font-size:18px;font-weight:700;border:2px solid var(--acc);background:#fff;color:var(--acc)}
  .knoepfe button.haupt{background:var(--acc);color:#fff} .knoepfe button:disabled{opacity:.4}
  .wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 420px;width:100%;max-width:560px;height:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .tafel{flex:1 1 300px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-height:200px}
  .nr{font-size:14px;color:var(--muted)} .txt{font-size:21px;line-height:1.45;margin-top:4px}
  .rech{font-size:28px;font-weight:700;margin-top:14px;min-height:44px}
  .rech .o{color:var(--or)} .rech .b{color:var(--bl)}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.2}
  .frac span:first-child{border-bottom:2px solid currentColor;padding:0 4px;color:var(--or)} .frac span:last-child{color:var(--bl)}
  .du{display:none;margin-top:14px;background:#fff;border:2px solid var(--acc);border-radius:12px;padding:10px 14px;font-size:19px;line-height:1.45} .du.da{display:block}
  svg text{font-family:inherit}
  .leucht{animation:leucht 1.4s ease-in-out 2;font-weight:800}
  @keyframes leucht{50%{font-size:30px}}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:14px 0}
</style>
</head>
<body>
<header><h1>Erklär-Tandem ★: Woher kommt das Minus?</h1></header>
<main>
  <div class="knoepfe"><button class="haupt" id="play">▶ Abspielen</button><button id="next">Nächster Schritt</button><button id="reset">Von vorn</button></div>
  <div class="wrap"><svg id="s" viewBox="0 0 520 500"></svg>
    <div class="tafel"><div class="nr" id="nr"></div><div class="txt" id="txt"></div><div class="rech" id="rech"></div></div></div>
  <div class="du" id="du"><b>Jetzt ihr:</b> Erkläre deinem Partner mit eigenen Worten: Warum steht in der Formel oben „8 − 2“ und unten „5 − 1“? Dein Partner fragt nach, bis es klar ist.</div>
</main>
<footer>Fehling · V.3 Gerade durch zwei Punkte · Erklär-Tandem ★</footer>
<script>
"use strict";
const D={"stufe": "★", "titel": "Erklär-Tandem ★: Woher kommt das Minus?", "zahlen": true, "P": ["1", "2"], "Q": ["5", "8"], "hy": "8 − 2 = 6", "lx": "5 − 1 = 4", "m": "m = <frac>8 − 2|5 − 1</frac> = <frac>6|4</frac> = 1,5", "t": ["Zwei Punkte einer Geraden: P ( 1 | 2 ) und Q ( 5 | 8 ).", "Wie hoch liegt Q? Das sagt der y-Wert von Q: 8.", "Wie hoch liegt P? Das sagt der y-Wert von P: 2.", "Der Höhenunterschied ist das Stück zwischen 2 und 8: 8 − 2 = 6. Das Minus rechnet aus, wie viel Q höher liegt als P.", "Wie weit rechts liegt Q? Das sagt der x-Wert von Q: 5.", "Wie weit rechts liegt P? Das sagt der x-Wert von P: 1.", "Der Längenunterschied ist das Stück zwischen 1 und 5: 5 − 1 = 4.", "Steigung = Höhenunterschied durch Längenunterschied. Beide Male rechnet man „Q minus P“."], "du": "Erkläre deinem Partner mit eigenen Worten: Warum steht in der Formel oben „8 − 2“ und unten „5 − 1“? Dein Partner fragt nach, bis es klar ist."};
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s");
const mk=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
const L=50,B=420,U=56,X=x=>L+x*U*1.25,Y=y=>B-y*U*0.82;   // x 0…6,5, y 0…9
const P=[1,2],Q=[5,8];
const frac=s=>s.replace(/<frac>([^|]+)\|([^<]+)<\/frac>/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
let n=0,timer=null,E={};
function grund(){
  svg.replaceChildren();
  for(let x=0;x<=6.5;x+=0.5)mk("line",{x1:X(x),x2:X(x),y1:Y(0),y2:Y(9.3),stroke:"var(--gitter)"});
  for(let y=0;y<=9.3;y+=0.5)mk("line",{x1:X(0),x2:X(6.5),y1:Y(y),y2:Y(y),stroke:"var(--gitter)"});
  mk("line",{x1:X(0),x2:X(6.6),y1:Y(0),y2:Y(0),stroke:"#333","stroke-width":2});mk("line",{x1:X(0),x2:X(0),y1:Y(0),y2:Y(9.5),stroke:"#333","stroke-width":2});
  let t=mk("text",{x:X(6.6)-4,y:Y(0)+22,"font-size":16});t.textContent="x";t=mk("text",{x:X(0)+8,y:Y(9.5)+6,"font-size":16});t.textContent="y";
  if(D.zahlen){for(let x=1;x<=6;x++){t=mk("text",{x:X(x),y:Y(0)+20,"text-anchor":"middle","font-size":14});t.textContent=x;}
    for(let y=1;y<=9;y++){t=mk("text",{x:X(0)-8,y:Y(y)+5,"text-anchor":"end","font-size":14});t.textContent=y;}}
  // Gerade durch P und Q
  const m=(Q[1]-P[1])/(Q[0]-P[0]);mk("line",{x1:X(0),y1:Y(P[1]-m*P[0]),x2:X(6.2),y2:Y(P[1]+m*(6.2-P[0])),stroke:"#8a99a8","stroke-width":3});
  E.g=mk("g",{});   // Ebene für Hilfslinien (unter den Punkten)
  for(const [p,nm,lab,dx] of [[P,"P",D.P,14],[Q,"Q",D.Q,-150]]){
    mk("circle",{cx:X(p[0]),cy:Y(p[1]),r:7,fill:"var(--acc)",stroke:"#fff","stroke-width":2});
    const tx=mk("text",{x:X(p[0])+dx,y:Y(p[1])+(nm==="P"?24:-14),"font-size":20,"font-weight":700,fill:"var(--acc)"});
    const s=(c,id)=>{const e=document.createElementNS(NS,"tspan");if(id)e.id=id;e.textContent=c;tx.appendChild(e);return e;};
    s(nm+" ( ");E[nm+"x"]=s(lab[0]);s(" | ");E[nm+"y"]=s(lab[1]);s(" )");
  }
}
let ANIM=false;   // nur der neueste Schritt pulsiert, frühere bleiben nur eingefärbt
const leucht=(e,f)=>{e.setAttribute("fill",f);if(ANIM)e.classList.add("leucht");};
const strich=(a,f,w,dash)=>mk("line",{x1:X(a[0]),y1:Y(a[1]),x2:X(a[2]),y2:Y(a[3]),stroke:f,"stroke-width":w,"stroke-dasharray":dash||"none","stroke-linecap":"round"},E.g);
const etikett=(x,y,t,f,anch="start")=>{const e=mk("text",{x:X(x),y:Y(y),"font-size":18,"font-weight":700,fill:f,"text-anchor":anch},E.g);e.textContent=t;};
const S=[
  ()=>{},
  ()=>{strich([Q[0],0,Q[0],Q[1]],"#f3c58f",6);leucht(E.Qy,"var(--or)");if(!D.zahlen)etikett(Q[0]+0.2,1.0,"y₂","var(--or)");},
  ()=>{strich([P[0],0,P[0],P[1]],"#f3c58f",6);strich([P[0],P[1],Q[0],P[1]],"var(--or)",2,"6 5");leucht(E.Py,"var(--or)");if(!D.zahlen)etikett(P[0]-0.2,P[1]/2,"y₁","var(--or)","end");},
  ()=>{strich([Q[0],P[1],Q[0],Q[1]],"var(--or)",7);etikett(Q[0]+0.2,(P[1]+Q[1])/2,D.hy,"var(--or)");E.rech.innerHTML=`<span class="o">Höhenunterschied: ${D.hy}</span>`;},
  ()=>{strich([0,-0.8,Q[0],-0.8],"#a9c3e8",6);leucht(E.Qx,"var(--bl)");if(!D.zahlen)etikett(Q[0]+0.12,-0.68,"x₂","var(--bl)");},
  ()=>{strich([0,-1.25,P[0],-1.25],"#a9c3e8",6);strich([P[0],P[1],P[0],-1.25],"var(--bl)",2,"6 5");strich([Q[0],Q[1],Q[0],-0.8],"var(--bl)",2,"6 5");leucht(E.Px,"var(--bl)");if(!D.zahlen)etikett(P[0]+0.12,-1.13,"x₁","var(--bl)");},
  ()=>{strich([P[0],P[1],Q[0],P[1]],"var(--bl)",7);etikett((P[0]+Q[0])/2+0.7,P[1]-0.55,D.lx,"var(--bl)","middle");E.rech.innerHTML+=`<br><span class="b">Längenunterschied: ${D.lx}</span>`;},
  ()=>{E.rech.innerHTML=frac(D.m);},
];
function zeig(){grund();E.rech=document.getElementById("rech");E.rech.innerHTML="";for(let i=0;i<n;i++){ANIM=i===n-1;S[i]();}
  // nur der zuletzt gezeigte Schritt leuchtet
  document.getElementById("nr").textContent=n?`Schritt ${n} von ${S.length}`:"";
  document.getElementById("txt").textContent=n?D.t[n-1]:"Tippe auf „Abspielen“ oder „Nächster Schritt“.";
  document.getElementById("du").classList.toggle("da",n>=S.length);document.getElementById("next").disabled=n>=S.length;}
const weiter=()=>{if(n<S.length){n++;zeig();}};
document.getElementById("next").onclick=()=>{clearInterval(timer);weiter();};
document.getElementById("reset").onclick=()=>{clearInterval(timer);n=0;zeig();};
document.getElementById("play").onclick=()=>{clearInterval(timer);n=0;zeig();weiter();timer=setInterval(()=>{weiter();if(n>=S.length)clearInterval(timer);},4200);};
zeig();
</script>
</body>
</html>
