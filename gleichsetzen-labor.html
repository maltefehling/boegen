<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Gleichsetzen-Labor</title>
<!-- V.8 (25.10.2026): Warum gleichsetzen? Zwei Punkte mit DEMSELBEN x – einer auf der Parabel (rot), einer auf der Geraden (blau).
     Beide y-Werte werden angezeigt; sind sie gleich, liegt ein gemeinsamer Punkt vor. Beispiel y = x² − 1 und y = x + 1 → ( −1 | 0 ), ( 2 | 3 )
     (andere Zahlen als im Skript). Regler + Abspielen. -->
<style>
  :root{--acc:#1f4e79;--par:#b5432f;--ger:#2e5d9f;--gr:#3f8f3a;--grH:#d9f0d6;--ink:#1b2a3a;--muted:#5b6b7c;--bg:#f4f7fb;--line:#c9d6e5;--gitter:#e1e7ee}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button,input{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff} header h1{font-size:20px;margin:0}
  main{padding:12px 16px 20px;max-width:1100px;margin:0 auto}
  .kn{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .kn button{flex:1 1 170px;min-height:52px;border-radius:12px;font-size:18px;font-weight:700;border:2px solid var(--acc);background:#fff;color:var(--acc)}
  .kn button.h{background:var(--acc);color:#fff}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 460px;width:100%;max-width:560px;height:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
  .side{flex:1 1 300px}
  .tab{width:100%;border-collapse:collapse;font-size:22px;background:#fff;border-radius:12px;overflow:hidden}
  .tab td{border:1px solid var(--line);padding:8px 12px;text-align:center}
  .p{color:var(--par);font-weight:800} .g{color:var(--ger);font-weight:800}
  .ctl{display:flex;align-items:center;gap:10px;margin:12px 0} .ctl input{flex:1;height:44px} .ctl b{font-size:20px;min-width:90px}
  .meld{font-size:20px;border-radius:12px;padding:10px 14px;min-height:60px;background:#fff;border:1px solid var(--line);line-height:1.4} .meld.ok{background:var(--grH);border-color:var(--gr)}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:12px 0} svg text{font-family:inherit}
</style>
</head>
<body>
<header><h1>Gleichsetzen-Labor: Wo haben beide dasselbe y?</h1></header>
<main>
  <div class="kn"><button class="h" id="play">▶ Abspielen</button><button id="reset">Von vorn</button></div>
  <div class="wrap"><svg id="s" viewBox="0 0 520 520"></svg>
    <div class="side">
      <table class="tab"><tr><td></td><td>Gleichung</td><td>y bei diesem x</td></tr>
        <tr><td class="p">Parabel</td><td class="p">y = x² − 1</td><td class="p" id="yp"></td></tr>
        <tr><td class="g">Gerade</td><td class="g">y = x + 1</td><td class="g" id="yg"></td></tr></table>
      <div class="ctl"><b id="xw">x = 0</b><input id="rx" type="range" min="-3" max="3" step="0.5" value="-3"></div>
      <div class="meld" id="meld"></div>
    </div></div>
</main>
<footer>Fehling · V.8 Schnittpunkte · Labor</footer>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s");
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;};
const U=40,O=260,X=v=>O+U*v,Y=v=>O-U*v,fmt=v=>{const r=Math.round(v*100)/100;return (r<0?"−":"")+String(Math.abs(r)).replace(".",",");};
const fp=x=>x*x-1,fg=x=>x+1;let x=-3,timer=null,gefunden=new Set();
function zeichne(){svg.replaceChildren();
  for(let i=-6;i<=6;i++){mk("line",{x1:X(i),x2:X(i),y1:20,y2:500,stroke:"var(--gitter)"});mk("line",{x1:20,x2:500,y1:Y(i),y2:Y(i),stroke:"var(--gitter)"});}
  mk("line",{x1:14,x2:506,y1:O,y2:O,stroke:"#333","stroke-width":2});mk("line",{x1:O,x2:O,y1:506,y2:14,stroke:"#333","stroke-width":2});
  for(let i=-6;i<=6;i+=2){if(!i)continue;let t=mk("text",{x:X(i),y:O+20,"text-anchor":"middle","font-size":15});t.textContent=fmt(i);t=mk("text",{x:O-8,y:Y(i)+5,"text-anchor":"end","font-size":15});t.textContent=fmt(i);}
  let d="";for(let i=0;i<=200;i++){const xx=-3.4+6.8*i/200,y=fp(xx);if(y>6.4)continue;d+=(d?"L":"M")+X(xx).toFixed(1)+" "+Y(y).toFixed(1);}
  mk("path",{d,fill:"none",stroke:"var(--par)","stroke-width":4});mk("line",{x1:X(-6),y1:Y(-5),x2:X(5.4),y2:Y(6.4),stroke:"var(--ger)","stroke-width":4});
  gefunden.forEach(v=>{mk("circle",{cx:X(v),cy:Y(fg(v)),r:9,fill:"var(--gr)",stroke:"#fff","stroke-width":2});const t=mk("text",{x:X(v)+12,y:Y(fg(v))+(v<0?22:-10),"font-size":18,"font-weight":800,fill:"var(--gr)"});t.textContent=`( ${fmt(v)} | ${fmt(fg(v))} )`;});
  // senkrechte Linie bei x, beide Punkte
  mk("line",{x1:X(x),x2:X(x),y1:20,y2:500,stroke:"#999","stroke-dasharray":"5 5"});
  mk("circle",{cx:X(x),cy:Y(fp(x)),r:8,fill:"var(--par)"});mk("circle",{cx:X(x),cy:Y(fg(x)),r:8,fill:"var(--ger)"});
  const yp=fp(x),yg=fg(x),gleich=Math.abs(yp-yg)<1e-9;
  document.getElementById("yp").textContent=fmt(yp);document.getElementById("yg").textContent=fmt(yg);document.getElementById("xw").textContent="x = "+fmt(x);
  const m=document.getElementById("meld");m.classList.toggle("ok",gleich);
  m.innerHTML=gleich?`<b>Gleiches y!</b> Bei x = ${fmt(x)} haben Parabel und Gerade beide y = ${fmt(yg)} – das ist ein gemeinsamer Punkt.<br>Darum setzt man die beiden Terme <b>gleich</b>:  x² − 1 = x + 1.`
                 :`Gleiches x, aber verschiedene y: ${fmt(yp)} ≠ ${fmt(yg)}. Hier treffen sich die beiden nicht.`;
  if(gleich)gefunden.add(x);}
const rx=document.getElementById("rx");rx.oninput=()=>{x=+rx.value;zeichne();};
document.getElementById("reset").onclick=()=>{clearInterval(timer);x=-3;rx.value=-3;gefunden.clear();zeichne();};
document.getElementById("play").onclick=()=>{document.getElementById("reset").onclick();timer=setInterval(()=>{x=Math.round((x+0.5)*2)/2;rx.value=x;zeichne();
  if(x>=3)clearInterval(timer);},Math.abs(fp(x)-fg(x))<1e-9?2600:1300);};
zeichne();
</script>
</body>
</html>
