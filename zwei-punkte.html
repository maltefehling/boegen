<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zwei-Punkte-Labor</title>
<!-- V.3 Gerade durch zwei Punkte – Kontrolle nach der eigenen Rechnung.
     Reiter „Zufahrt“ (?modus=zufahrt): Maßstab wie im Skript (x 0 … 70 m in 5-m-Schritten, y 0 … 6 m in 0,5-m-Schritten).
     Reiter „Koordinatensystem“: −6 … 6, ganze Zahlen.  Reiter „Gleiche Steigung?“: beide Punkte wandern auf y = 0,5x + 1 – das Dreieck ändert sich, m bleibt 0,5.
     Gezeigt werden Längenunterschied, Höhenunterschied, m und die Gleichung. -->
<style>
  :root{--ink:#1b2a3a;--muted:#5b6b7c;--acc:#1f4e79;--bg:#f4f7fb;--card:#fff;--line:#c9d6e5;--gitter:#e1e7ee;--gitter2:#c8d3df;--ger:#2f5f8f;--dr:#c0700f;--rot:#c0392b;--gr:#2e8b3d}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  button{font:inherit;touch-action:manipulation}
  header{padding:12px 16px;background:var(--acc);color:#fff;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
  header h1{font-size:20px;margin:0} header span{font-size:15px;opacity:.85}
  main{padding:12px 16px 20px;max-width:1150px;margin:0 auto}
  .tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{flex:1 1 180px;min-height:52px;border:2px solid var(--acc);background:#fff;color:var(--acc);border-radius:12px;font-size:19px;font-weight:700}
  .tabs button[aria-pressed="true"]{background:var(--acc);color:#fff}
  .wrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  svg{flex:1 1 520px;width:100%;max-width:680px;height:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;touch-action:none}
  .side{flex:1 1 300px;min-width:0}
  .zahl{font-size:21px;padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;line-height:1.55;font-variant-numeric:tabular-nums}
  .zahl b{color:var(--dr)} .p{color:var(--rot);font-weight:700}
  .gl{font-size:30px;font-weight:700;text-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;white-space:nowrap;overflow-x:auto}
  .hint{font-size:15px;color:var(--muted)}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:10px 0 18px}
  svg text{font-family:inherit}
</style>
</head>
<body>
<header><h1>Zwei-Punkte-Labor</h1><span>Kontrolle – erst nach deiner Rechnung</span></header>
<main>
  <div class="tabs" id="tabs">
    <button data-m="zufahrt">Zufahrt</button>
    <button data-m="frei">Koordinatensystem</button>
    <button data-m="gleich">Gleiche Steigung?</button>
  </div>
  <div class="wrap">
    <svg id="s" viewBox="0 0 640 440" aria-label="Koordinatensystem mit zwei Punkten"></svg>
    <div class="side">
      <div class="zahl" id="pk"></div>
      <div class="zahl" id="un"></div>
      <div class="gl" id="gl"></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
</main>
<footer>Fehling · Gerade durch zwei Punkte</footer>
<script>
"use strict";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("s");
const mk=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
const r2=v=>Math.round(v*1000)/1000;
const fmt=v=>{v=r2(v);return (v<0?"−":"")+Math.abs(v).toString().replace(".",",");};
const L=60,R=610,T=20,B=390;
const MODI={
  zufahrt:{x0:0,x1:70,y0:0,y1:6,sx:5,sy:0.5,lx:10,ly:1,P:[5,1],Q:[30,3],hint:"Ziehe die roten Punkte auf Anfang und Ende deines Plans. Sie rasten in 5-m- bzw. 0,5-m-Schritten ein.",xl:"x in m",yl:"Höhe y in m"},
  frei:{x0:-6,x1:6,y0:-6,y1:6,sx:1,sy:1,lx:2,ly:2,P:[-2,-1],Q:[3,4],hint:"Ziehe die beiden roten Punkte. Sie rasten auf ganzen Zahlen ein.",xl:"x",yl:"y"},
  gleich:{x0:-6,x1:6,y0:-6,y1:6,sx:1,sy:1,lx:2,ly:2,P:[-4,-1],Q:[2,2],hint:"Beide Punkte liegen immer auf derselben Geraden. Schiebe sie hin und her: Was passiert mit dem Dreieck – und was mit m?",xl:"x",yl:"y",auf:x=>0.5*x+1},
};
let mode="zufahrt",m0=MODI.zufahrt,P=[...m0.P],Q=[...m0.Q],zieh=null;
const X=v=>L+(R-L)*(v-m0.x0)/(m0.x1-m0.x0),Y=v=>B-(B-T)*(v-m0.y0)/(m0.y1-m0.y0);
const Xi=px=>m0.x0+(px-L)/(R-L)*(m0.x1-m0.x0),Yi=py=>m0.y0+(B-py)/(B-T)*(m0.y1-m0.y0);
function zeichne(){
  svg.replaceChildren();
  for(let v=m0.x0;v<=m0.x1+1e-9;v+=m0.sx)mk("line",{x1:X(v),x2:X(v),y1:T,y2:B,stroke:Math.abs(r2(v/m0.lx)%1)<1e-6?"var(--gitter2)":"var(--gitter)"});
  for(let v=m0.y0;v<=m0.y1+1e-9;v+=m0.sy)mk("line",{x1:L,x2:R,y1:Y(v),y2:Y(v),stroke:Math.abs(r2(v/m0.ly)%1)<1e-6?"var(--gitter2)":"var(--gitter)"});
  const ax=Y(Math.max(m0.y0,0)),ay=X(Math.max(m0.x0,0));
  mk("line",{x1:L,x2:R+14,y1:ax,y2:ax,stroke:"#333","stroke-width":2});mk("line",{x1:ay,x2:ay,y1:B,y2:T-10,stroke:"#333","stroke-width":2});
  for(let v=m0.x0;v<=m0.x1+1e-9;v+=m0.lx){if(Math.abs(v)<1e-9&&m0.x0<0)continue;const t=mk("text",{x:X(v),y:ax+20,"text-anchor":"middle","font-size":15});t.textContent=fmt(v);}
  for(let v=m0.y0;v<=m0.y1+1e-9;v+=m0.ly){if(Math.abs(v)<1e-9)continue;const t=mk("text",{x:ay-8,y:Y(v)+5,"text-anchor":"end","font-size":15});t.textContent=fmt(v);}
  let t=mk("text",{x:R+14,y:ax-8,"text-anchor":"end","font-size":15,fill:"var(--acc)"});t.textContent=m0.xl;
  t=mk("text",{x:ay+8,y:T+2,"font-size":15,fill:"var(--acc)"});t.textContent=m0.yl;
  const dx=r2(Q[0]-P[0]),dy=r2(Q[1]-P[1]);
  const clip=mk("clipPath",{id:"k"});mk("rect",{x:L,y:T,width:R-L,height:B-T},clip);const g=mk("g",{"clip-path":"url(#k)"});
  if(dx!==0){const m=dy/dx,c=P[1]-m*P[0];mk("line",{x1:X(m0.x0),y1:Y(m*m0.x0+c),x2:X(m0.x1),y2:Y(m*m0.x1+c),stroke:"var(--ger)","stroke-width":3.5},g);}
  // Steigungsdreieck: waagrecht von P aus, dann senkrecht zu Q
  mk("line",{x1:X(P[0]),y1:Y(P[1]),x2:X(Q[0]),y2:Y(P[1]),stroke:"var(--dr)","stroke-width":4},g);
  mk("line",{x1:X(Q[0]),y1:Y(P[1]),x2:X(Q[0]),y2:Y(Q[1]),stroke:"var(--dr)","stroke-width":4},g);
  t=mk("text",{x:(X(P[0])+X(Q[0]))/2,y:Y(P[1])+(dy>=0?22:-10),"text-anchor":"middle","font-size":17,"font-weight":700,fill:"var(--dr)"});t.textContent=fmt(dx);
  t=mk("text",{x:X(Q[0])+8,y:(Y(P[1])+Y(Q[1]))/2+6,"font-size":17,"font-weight":700,fill:"var(--dr)"});t.textContent=fmt(dy);
  for(const [p,n] of [[P,"P"],[Q,"Q"]]){mk("circle",{cx:X(p[0]),cy:Y(p[1]),r:13,fill:"var(--rot)",stroke:"#fff","stroke-width":3});
    t=mk("text",{x:X(p[0])-18,y:Y(p[1])-14,"font-size":17,"font-weight":700,fill:"var(--rot)","text-anchor":"middle"});t.textContent=n;}
  document.getElementById("pk").innerHTML=`<span class="p">P ( ${fmt(P[0])} | ${fmt(P[1])} )</span> &nbsp; <span class="p">Q ( ${fmt(Q[0])} | ${fmt(Q[1])} )</span>`;
  if(dx===0){document.getElementById("un").innerHTML="Längenunterschied 0 – durch 0 kann man nicht teilen. Das ist keine Gerade der Form y = m · x + c.";document.getElementById("gl").textContent="—";return;}
  const m=dy/dx,c=P[1]-m*P[0];
  const kl=v=>v<0?"( "+fmt(v)+" )":fmt(v);   // negative Zahl nach Minus/Geteilt in Klammern
  document.getElementById("un").innerHTML=`Längenunterschied: ${fmt(Q[0])} − ${kl(P[0])} = <b>${fmt(dx)}</b><br>Höhenunterschied: ${fmt(Q[1])} − ${kl(P[1])} = <b>${fmt(dy)}</b><br>m = ${fmt(dy)} : ${kl(dx)} = <b>${fmt(m)}</b>`;
  const mt=r2(m)===0?"":(fmt(m)==="1"?"":fmt(m)==="−1"?"−":fmt(m)+" · ")+"x";
  const ct=r2(c)===0?(mt?"":"0"):(mt?(c<0?" − ":" + ")+fmt(Math.abs(c)):fmt(c));
  document.getElementById("gl").textContent="y = "+mt+ct;
}
const snap=(v,s,a,b)=>Math.max(a,Math.min(b,Math.round(v/s)*s));
const pos=ev=>{const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
svg.addEventListener("pointerdown",ev=>{const p=pos(ev),dP=Math.hypot(p.x-X(P[0]),p.y-Y(P[1])),dQ=Math.hypot(p.x-X(Q[0]),p.y-Y(Q[1]));
  zieh=dP<dQ?P:Q;svg.setPointerCapture(ev.pointerId);bewege(ev);});
function bewege(ev){if(!zieh)return;const p=pos(ev);let x=snap(Xi(p.x),m0.sx,m0.x0,m0.x1);
  if(m0.auf){x=snap(x,1,-6,4);zieh[0]=x;zieh[1]=m0.auf(x);}else{zieh[0]=x;zieh[1]=snap(Yi(p.y),m0.sy,m0.y0,m0.y1);}zeichne();}
svg.addEventListener("pointermove",bewege);svg.addEventListener("pointerup",()=>zieh=null);svg.addEventListener("pointercancel",()=>zieh=null);
function setMode(mm){mode=mm;m0=MODI[mm];P=[...m0.P];Q=[...m0.Q];
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mm));document.getElementById("hint").textContent=m0.hint;zeichne();}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
const q=new URLSearchParams(location.search).get("modus");setMode(MODI[q]?q:"zufahrt");
</script>
</body>
</html>
